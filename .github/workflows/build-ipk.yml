name: Build Passwall IPK

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
  # N60 Pro 是 aarch64 架构，建议在 ubuntu 22.04 环境下编译
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-pip rsync subversion unzip zlib1g-dev libelf-dev swig flex bison cmake g++ wget
          sudo timedatectl set-timezone "Asia/Shanghai"
          
      - name: Download and Extract SDK
        run: |
          # 注意：这里以 ImmortalWrt 24.10 的 aarch64 SDK 为例（如果官方有对应的 snapshot SDK 链接可替换）
          # 也可以替换为你当前固件源码配套的 SDK 压缩包直链
          # SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic/immortalwrt-sdk-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          # SDK_URL="https://downloads.immortalwrt.org/releases/24.10.0/targets/mediatek/filogic/immortalwrt-sdk-24.10.0-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -q $SDK_URL -O sdk.tar.zst
          tar -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk
          cd sdk

          # 1. 准备 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 2. 下载 Passwall 及其依赖包
          mkdir -p package/passwall/luci package/passwall/packages
          
          wget -q https://github.com/Openwrt-Passwall/openwrt-passwall/archive/refs/heads/main.zip -O luci.zip
          unzip -q luci.zip
          cp -rf openwrt-passwall-main/* package/passwall/luci/
          rm -rf luci.zip openwrt-passwall-main

          wget -q https://github.com/Openwrt-Passwall/openwrt-passwall-packages/archive/refs/heads/main.zip -O packages.zip
          unzip -q packages.zip
          cp -rf openwrt-passwall-packages-main/* package/passwall/packages/
          rm -rf packages.zip openwrt-passwall-packages-main

          # 3. 关键步骤：物理删除依赖 Rust 的源码目录，阻断 SDK 扫描 Rust 工具链
          rm -rf package/passwall/packages/shadowsocks-rust
          rm -rf package/passwall/packages/tuic-client
          rm -rf feeds/packages/lang/rust

          # 4. 启用 Passwall 配置
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_include_sing_box=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_include_xray=y" >> .config
          echo "CONFIG_PACKAGE_chinadns-ng=y" >> .config

          make defconfig

          # 5. 开始编译
          make package/luci-app-passwall/compile V=99

      - name: Organize IPK Files
        run: |
          mkdir -p compiled_ipks
          # 将编译好的 ipk 收集到指定目录
          find sdk/bin/packages/ -name "*.ipk" -exec cp {} compiled_ipks/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passwall-ipks
          path: compiled_ipks/*.ipk
